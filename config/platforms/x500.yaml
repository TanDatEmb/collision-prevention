# Platform values for the X500 Gazebo SITL reference platform.
# Every value is null until the owner approves it: never fill one without an owner decision. Filled so far:
# the mount (owner, 2026-11-21), the model name, `height_up_m` and `height_down_m` (chosen under the owner's
# delegation of 2026-11-22, bench values, OPEN-036), and the G4 bench values approved by the owner on 2026-11-24
# (#207) from the Gazebo SITL campaigns: bench values for X500 SITL, not flight values. Still null: the gyro
# history (Livox source only, measured on the real sensor).
platform: x500
sim:
  gz_model: x500_lidar_multi_ring  # OPEN-029 (tools/scenarios/models, bench asset)
sensor:
  mount_pose_in_base_link:  # livox_frame -> base_link
    xyz_m: [0.12, 0.0, 0.14]  # OPEN-029, bench mount R1 (owner, 2026-11-21): sensor from base_link; lever arm 0.184 m
    rpy_rad: [0.0, 0.1745, 0.0]  # boresight 10 degrees down (positive pitch about +y turns +x toward -z)
pose_history:  # the pose input of the leveling step (#137, ADR 0022 decision 2)
  depth: 64  # bench (#207): 0.64 s of odometry at about 100 Hz in SITL; used in every SITL campaign
  max_bracket_gap_ms: 50  # bench (#207): five odometry periods; about 1.5 % of rays dropped at frame ends in SITL
gyro_history:  # the Livox gyro track for the rotation inside one frame (ADR 0023), source livox only
  depth: null  # TBD (samples kept at 200 Hz)
  max_bracket_gap_ms: null  # TBD: above the 6.0 ms IMU step measured (ADR 0023 decision 4)
sector_map:
  height_up_m: 0.25  # OPEN-036, bench, delegated 2026-11-22: from the lidar, level frame (ADR 0022)
  height_down_m: 0.60  # OPEN-036, bench, delegated 2026-11-22: from the lidar, level frame
  rear_start_rad: 2.3492  # ADR 0020 D3 option B (issue #141): 134.6 degrees, where the horizon leaves the field of view at level (closed form)
  obstacle_window_m: 0.5  # bench (#207), OPEN-041 (dr); SITL has no noise model, so false stops are not measured
  obstacle_min_returns: 3  # bench (#207), OPEN-041 (n_obstacle)
  free_min_rays: 5  # bench (#207), OPEN-023 (n_free)
  # Trade-off (ADR 0024, tools/scenarios/certified_range.py): a covered sector is certified free to
  # certified_range_m, which sets the top speed through the cp_brake stopping model; it can only be as long as one
  # sector is guaranteed n_obstacle returns from the smallest claimed obstacle: longer range = larger smallest
  # obstacle (h_obj tall, w_obj wide) or a denser sensor. Examples at Livox-like gaps (1.07 x 1.0 deg), band 0.85 m:
  # face-on 1.0 x 1.5 m -> 20.9 m, 7.4 m/s; 1.0 x 3.0 m -> 28.6 m, 9.3 m/s; 1.0 x 5.0 m -> 40 m, 11.6 m/s (the wire
  # cap; 12 m/s needs 41.9 m with CPB_T_LAT 0.95 s, CPB_A_BRK 3, CPB_JERK 4); a surface at 45 deg with a 0.5 m
  # window and 3 returns -> 19.6 m (a wider window or fewer returns lengthen it and admit more false stops).
  # Chosen (#207, VM-56, 1.07 x 1.0 deg grid sensor at 5 m/s): no frame over-claimed inside 20 m for poles of
  # 0.3 m and more, the lattice tower and the vertical 0.2 m bar (horizontal 0.2 m bar 19.8 m); thinner objects
  # are a non-claim. 20 m allows 7.1 m/s with the bench stopping model. Re-derive for the real sensor (OPEN-023).
  certified_range_m: 20.0
  # Trade-off: a larger allowance counts more band-edge returns as obstacles (fewer over-claims under attitude
  # error, more false stops near the band edges); it must cover the measured attitude error (SITL EKF tilt error
  # p99 0.68, max 0.85 deg; target not measured, #156). It does not change certified_range_m.
  attitude_allowance_rad: 0.0157  # bench (#207): 0.9 deg, above the SITL EKF tilt error (p99 0.68, max 0.85 deg, #182)
# Decided by the owner on 2026-11-22 (OPEN-046): the four propeller discs of the X500 SDF and meshes, base_link
# FLU (x forward, y left, z up), radius = propeller radius 0.1465 m + 0.01 m, z = propeller thickness + 0.01 m.
# Applied in the body frame with the mount above (FEAT-23, #206). The CAD value of the real airframe is OPEN-005.
self_mask:
  cylinders:
    - {center_m: [0.174, 0.174], radius_m: 0.1565, z_min_m: 0.034, z_max_m: 0.0794}
    - {center_m: [0.174, -0.174], radius_m: 0.1565, z_min_m: 0.034, z_max_m: 0.0794}
    - {center_m: [-0.174, 0.174], radius_m: 0.1565, z_min_m: 0.034, z_max_m: 0.0794}
    - {center_m: [-0.174, -0.174], radius_m: 0.1565, z_min_m: 0.034, z_max_m: 0.0794}
